name: release

# Push a tag like v3.0.0 on main to publish every package at that version to PyPI.
# Uses PyPI trusted publishing (OIDC): no token is stored in the repository. Each package name needs a
# (pending) trusted publisher on PyPI: owner dudikkocak, repository xqo, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check that every package's version matches the tag
        run: uv run --no-project python tools/release_check.py "${GITHUB_REF_NAME#v}"
      - name: Build and check the sdists and wheels
        run: |
          for p in $(uv run --no-project python tools/release_check.py --list); do
            uv run --no-project python tools/check_wheel.py "packages/$p"
            uv build --out-dir dist "packages/$p"
          done
          ls -l dist
      - name: Install the wheels together and check the plugins load
        run: |
          uv venv /tmp/w
          uv pip install --python /tmp/w/bin/python dist/*.whl
          /tmp/w/bin/python -c "import xqo.api as a; print(a.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xqo/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
