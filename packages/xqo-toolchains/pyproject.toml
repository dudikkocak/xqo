[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xqo-toolchains"
version = "3.1.0"
description = "Node, Go, Rust and .NET setup for xqo run_code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "dudikkocak"}]
dependencies = [
  "xqo>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.urls]
Homepage = "https://github.com/dudikkocak/xqo"

[project.entry-points."xqo.plugins"]
toolchains = "xqo_toolchains:ToolchainsPlugin"

[tool.setuptools.packages.find]
where = ["src"]
