[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xqo-flows"
version = "3.1.1"
description = "Visual workflows for xqo: a FlowGram.AI editor, a flow runner and remote workers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "dudikkocak"}]
dependencies = [
  "xqo>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/dudikkocak/xqo"

[project.entry-points."xqo.plugins"]
flows = "xqo_flows:FlowsPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xqo_flows = ["static/*", "static/**/*", "examples/*.json"]
