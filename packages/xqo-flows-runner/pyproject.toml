[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xqo-flows-runner"
version = "3.2.0"
description = "Headless remote worker for xqo flows: runs flow steps and whole flows with its own agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "dudikkocak"}]
dependencies = [
  "xqo>=3.0,<4",
  "xqo-flows==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/dudikkocak/xqo"

[project.entry-points."xqo.plugins"]
flows_runner = "xqo_flows_runner:RunnerPlugin"

[tool.setuptools.packages.find]
where = ["src"]
