[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xqo"
dynamic = ["version"]
description = "xqo: a small, plugin-based HQ of Claude agents with a live dashboard and a 2D / 3D office"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "dudikkocak"}]
keywords = ["claude", "agents", "llm", "orchestration", "dashboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "anthropic>=2.2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "claude-agent-sdk>=0.2.170",   # agents run as Claude Code sessions; also brings the mcp package
]

[project.optional-dependencies]
# One extra per plugin package, pinned to this release; automation = schedules + feeds, all = every xqo-* plugin.
sqlite = ["xqo-sqlite==3.1.0"]
postgres = ["xqo-postgres==3.1.0"]
docker = ["xqo-docker==3.1.0"]
toolchains = ["xqo-toolchains==3.1.0"]
agency = ["xqo-agency==3.1.0"]
schedules = ["xqo-schedules==3.1.0"]
feeds = ["xqo-feeds==3.1.0"]
automation = ["xqo-schedules==3.1.0", "xqo-feeds==3.1.0"]
channels = ["xqo-channels==3.1.0"]
peering = ["xqo-peering==3.1.0"]
all = ["xqo-sqlite==3.1.0", "xqo-postgres==3.1.0", "xqo-docker==3.1.0", "xqo-toolchains==3.1.0", "xqo-agency==3.1.0",
       "xqo-schedules==3.1.0", "xqo-feeds==3.1.0", "xqo-channels==3.1.0", "xqo-peering==3.1.0"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/dudikkocak/xqo"
Issues = "https://github.com/dudikkocak/xqo/issues"

[project.scripts]
xqo = "xqo.__main__:main"

[tool.setuptools]
packages = {find = {include = ["xqo*"]}}

[tool.setuptools.dynamic]
version = {attr = "xqo.__version__"}

[tool.setuptools.package-data]
xqo = ["static/*", "static/js/*", "static/vendor/*", "static/vendor/fonts/*", "default_agents.json", "default_departments/*", "plugins/office/static/*", "plugins/office/static/office/*/*", "plugins/office/static/office3d/*", "plugins/office/static/office3d/*/*", "plugins/office/static/office3d/*/*/*", "plugins/office/static/vendor/miniverse/*", "plugins/office/static/vendor/three/*", "plugins/office/static/vendor/three/addons/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
