[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xqo-schedules"
version = "3.2.1"
description = "Scheduled and repeating tasks for xqo (cron, every, at)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "dudikkocak"}]
dependencies = [
  "xqo>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/dudikkocak/xqo"

[project.entry-points."xqo.plugins"]
schedules = "xqo_schedules:SchedulesPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xqo_schedules = ["static/*"]
