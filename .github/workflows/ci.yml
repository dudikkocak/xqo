name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true  # v6+ no longer creates .venv on its own
      - name: Install xqo
        # activate-environment makes setup-uv create and activate .venv
        run: uv pip install -e "packages/xqo[dev]"
      - name: Tests
        run: uv run --no-project python -m pytest packages/xqo/tests -q --timeout 120

  # each plugin package is tested against the base package only, so it can't lean on another plugin
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [xqo-sqlite, xqo-docker, xqo-agency, xqo-toolchains, xqo-schedules, xqo-feeds, xqo-channels, xqo-peering,
                  xqo-flows, xqo-flows-runner]
        include:
          - package: xqo-toolchains
            with: -e packages/xqo-docker  # its docker tests need the docker backend
          - package: xqo-feeds
            with: -e packages/xqo-schedules  # a dependency, not yet on PyPI at this version
          - package: xqo-flows
            with: -e packages/xqo-schedules  # schedule triggers use its cron parser
          - package: xqo-flows-runner
            with: -e packages/xqo-flows  # a dependency, not yet on PyPI at this version
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true  # v6+ no longer creates .venv on its own
      - name: Install xqo and ${{ matrix.package }}
        run: uv pip install -e "packages/xqo[dev]" -e "packages/${{ matrix.package }}[dev]" ${{ matrix.with }}
      - name: Tests
        run: uv run --no-project python -m pytest packages/${{ matrix.package }}/tests -q --timeout 120

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xqo
          POSTGRES_PASSWORD: xqo
          POSTGRES_DB: xqo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xqo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XQO_TEST_PG_DSN: postgresql://xqo:xqo@localhost:5432/xqo_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true  # v6+ no longer creates .venv on its own
      - name: Install xqo and xqo-postgres
        run: uv pip install -e "packages/xqo[dev]" -e "packages/xqo-postgres[dev]"
      - name: Tests (they skip without XQO_TEST_PG_DSN, so check that none did)
        run: uv run --no-project python -m pytest packages/xqo-postgres/tests -q --timeout 120 -rs | tee out.txt && ! grep -q skipped out.txt

  flows-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Rebuild the FlowGram editor and check the committed bundle is up to date
        working-directory: packages/xqo-flows/editor
        run: |
          npm ci --no-audit --no-fund
          npx tsc -p .
          npm run build
          git diff --exit-code -- ../src/xqo_flows/static/ || (echo "editor.js is stale: run npm run build in packages/xqo-flows/editor"; exit 1)

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true  # v6+ no longer creates .venv on its own
      - name: Build the wheels and check their files
        run: |
          for p in $(python3 tools/release_check.py --list); do
            uv run --no-project python tools/check_wheel.py packages/$p
          done
      - name: Install the wheel and import the public API
        run: |
          for p in $(python3 tools/release_check.py --list); do uv build --wheel --out-dir dist packages/$p; done
          uv venv /tmp/w
          uv pip install --python /tmp/w/bin/python dist/*.whl
          /tmp/w/bin/python -c "import xqo.api as a; print(a.__version__, a.API_VERSION)"
          /tmp/w/bin/xqo --help > /dev/null
          /tmp/w/bin/python -c "import json, pathlib, tempfile; from xqo.config import build; d = pathlib.Path(tempfile.mkdtemp()); c = d / 'agents.json'; c.write_text(json.dumps({'agents': [{'name': 'p', 'skills': ['planning']}]})); s = build(c, d / 'a', str(d / 'l' / 'e.jsonl'), mock=True, departments='none').plugins.states; bad = [n for n in ('sqlite', 'postgres', 'docker', 'toolchains', 'agency', 'schedules', 'feeds', 'channels', 'peering', 'flows', 'flows_runner') if s[n].state not in ('active', 'inactive')]; assert not bad, bad"
