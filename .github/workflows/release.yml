name: release

# Push a tag like v3.0.0 on main to publish every package at that version to PyPI.
# Uploads with PyPI Trusted Publishing (OIDC): no token is stored. Each package on pypi.org must list this repository,
# workflow release.yml and environment pypi as a trusted publisher. Protect the pypi environment in the repo settings.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true  # v6+ no longer creates .venv on its own
      - name: Check that every package's version matches the tag
        run: uv run --no-project python tools/release_check.py "${GITHUB_REF_NAME#v}"
      - name: Build and check the sdists and wheels
        run: |
          for p in $(uv run --no-project python tools/release_check.py --list); do
            uv run --no-project python tools/check_wheel.py "packages/$p"
            uv build --out-dir dist "packages/$p"
          done
          ls -l dist
      - name: Install the wheels together and check the plugins load
        run: |
          uv venv /tmp/w
          uv pip install --python /tmp/w/bin/python dist/*.whl
          /tmp/w/bin/python -c "import xqo.api as a; print(a.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xqo/
    permissions:
      id-token: write  # mint the OIDC token PyPI trusts; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run after a partial upload finishes the rest
