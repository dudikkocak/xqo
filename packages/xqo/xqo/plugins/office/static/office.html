<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ Office</title>
<link rel="stylesheet" href="/static/vendor/hljs-github-dark.min.css">
<link rel="stylesheet" href="/static/vendor/katex.min.css">
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/markdown-it.min.js"></script>
<script src="/static/vendor/markdown-it-footnote.min.js"></script>
<script src="/static/vendor/markdown-it-task-lists.min.js"></script>
<script src="/static/vendor/katex.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/render.js"></script>
<script src="/static/usage.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#12151b;--line:#2a2f3a;--text:#e6e8ee;--mute:#8b93a7;--accent:#7aa2ff;
--attention:#ff5d6c;--ok:#68d391;--warn:#f6ad55;color-scheme:dark;--sb:#3a4150}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);height:50px;min-width:0;overflow:hidden}
header>.side{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}header>.side.r{justify-content:flex-end}
#usage{font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
#usage:empty,#ratelim:empty{display:none}#usage b{color:var(--ok);font-weight:600}#usage .est{color:var(--mute);font-size:11px}
header>.mid{display:flex;align-items:center;gap:6px;min-width:0}
#ratelim{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
#ratelim.warn{color:var(--warn);border-color:var(--warn)}#ratelim.bad{color:#0b0d12;background:var(--attention);border-color:var(--attention);font-weight:600}
header h1{font-size:16px;margin:0;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--attention);display:inline-block;flex:none}.dot.on{background:var(--ok)}
#status{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
textarea,select,input,button{font:inherit;color:var(--text);background:#0c0e12;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;resize:vertical}
button{background:var(--accent);color:#0b0d12;border:0;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.busy:disabled{opacity:1;animation:busy 1.2s ease-in-out infinite}@keyframes busy{50%{opacity:.55}}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);padding:3px 8px;font-size:12px;border-radius:6px;text-decoration:none;font-weight:600;white-space:nowrap}
.ghost.on{background:var(--accent);color:#0b0d12;border-color:var(--accent)}
header select{font-size:12px;padding:3px 6px;max-width:300px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:12px;height:calc(100vh - 50px);height:calc(100dvh - 50px)}
body.nopanel main{grid-template-columns:minmax(0,1fr)}body.nopanel #panel{display:none}
#stage{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:auto;position:relative;min-width:0}
#world{display:inline-block;line-height:0;margin:auto}
#world canvas{display:block}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;padding:20px;text-align:center}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;padding:12px 14px;min-width:0}
#panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 0 8px}
#panel h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mute);font-size:12px}
.avi{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;display:inline-block}.avi.txt{display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:30px;font-size:22px;line-height:30px}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.working,.chip.running{color:var(--ok);border-color:var(--ok)}.chip.error,.chip.needs_attention{color:var(--attention);border-color:var(--attention)}
.chip.sleeping,.chip.paused{color:#b794f4;border-color:#b794f4}.chip.speaking{color:#4fd1c5;border-color:#4fd1c5}
.att{border:1px solid var(--attention);border-radius:8px;padding:8px 10px;margin:6px 0;background:rgba(255,93,108,.06)}
.att .q{white-space:pre-wrap;font-size:13px;margin-bottom:6px;max-height:160px;overflow:auto}
.att.al.done{border-color:#38a169;background:rgba(56,161,105,.07)}.att.al.auto_confirmed{border-color:#f6ad55;background:rgba(246,173,85,.07)}.att.al .row{justify-content:flex-end}
.row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
/* agent reports: list under "New task", Markdown preview */
.reps{display:flex;flex-direction:column;gap:4px}
.rep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12px}
.rep:hover{border-color:var(--accent)}.rep .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.rep .sub{grid-column:1/3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rview{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
#rview.on{display:flex}
#rview .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;min-width:0}
#rview .hd{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
#rview .hd b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#rview .bd{overflow:auto;padding:14px 18px}
.codeblk,.mmd{margin:.5em 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cb-bar,.mmd-bar{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 8px;background:var(--panel2);font-size:11px;color:var(--mute)}
.cb-lang{flex:1;font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-bar button,.mmd-bar button{width:auto;padding:0 6px;font-size:11px;background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:4px}
.mmd-out{padding:8px;overflow:auto;text-align:center;background:#0c0e12}.mmd-out svg{max-width:100%;height:auto}
.mmd-src{border-top:1px solid var(--line)}
.math-block{overflow-x:auto;overflow-y:hidden;margin:.4em 0}.math-err{color:var(--attention);background:rgba(252,129,129,.08)}
.md{white-space:normal;color:#c9cfdc;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.35em 0}.md h1,.md h2,.md h3,.md h4{margin:.7em 0 .3em;line-height:1.25;color:var(--text);text-transform:none;letter-spacing:0;padding:0;border:0;display:block;font-weight:650}
.md h1{font-size:1.3em}.md h2{font-size:1.15em}.md h3{font-size:1.02em}.md h4{font-size:.95em}
.md code{font:12px ui-monospace,monospace;background:#0c0e12;padding:1px 4px;border-radius:4px}
.md pre{margin:0;padding:8px 10px;overflow:auto;background:#0c0e12;font:12px/1.45 ui-monospace,monospace;white-space:pre}
.md pre code{padding:0;background:none}.md pre code.hljs{background:transparent;padding:0}
.md table{border-collapse:collapse;margin:.5em 0;display:block;overflow:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}.md th{background:var(--panel2)}
.md blockquote{margin:.4em 0;padding:0 10px;border-left:3px solid var(--line);color:var(--mute)}
.md ul,.md ol{padding-left:1.5em;margin:.3em 0}.md li{margin:.1em 0}
.md .task-list-item{list-style:none}.md .task-list-item input{width:auto;margin:0 6px 0 -1.3em;vertical-align:middle}
.md a{color:var(--accent)}.md img{max-width:100%}.md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
.md .footnotes{font-size:12px;color:var(--mute)}.md .footnotes-sep{margin:.6em 0}
.tasks{display:flex;flex-direction:column;gap:4px}
.task{display:flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12px;min-width:0}
.task span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.task.sel{border-color:var(--accent);background:rgba(122,162,255,.08)}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--panel2)}
.tabs{display:flex;gap:4px}
.hint{color:var(--mute);font-size:12px;margin-top:6px}
.err{color:var(--attention);font-size:12px;margin-top:6px;white-space:pre-wrap}
body.v3d #stage{overflow:hidden}
body.v3d #world{position:absolute;inset:0;display:block;line-height:normal}
body.v3d #world canvas{display:block;touch-action:none}
.o3{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.o3>div,.o3>a{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.o3-label{font:600 11px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.62);padding:0 5px;border:2px solid transparent;border-radius:5px;margin:-18px 0 0 0;translate:-50% 0}
.o3-icon{position:absolute;left:0;top:0;pointer-events:none;font-size:16px;line-height:1;margin:-30px 0 0 0;translate:-50% 0;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.o3-label.sel{background:var(--accent);color:#0b0d12}.o3-label.dim{opacity:.35}
.o3-badge{font:700 11px system-ui,sans-serif;color:#fff;background:var(--attention);min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;padding:0 4px;translate:-50% -100%}
.o3-badge.blink{animation:o3blink 1s ease-in-out infinite}@keyframes o3blink{50%{opacity:.35;box-shadow:0 0 0 6px rgba(255,93,108,.35)}}
.o3-badge.zz{background:#6b46c1}.o3-badge.ok{background:#38a169}.o3-badge.fail{background:#e53e3e}
.o3>.o3-bubble{font:12px/1.3 system-ui,sans-serif;color:#111;background:#fff;border-radius:8px;padding:4px 8px;max-width:240px;white-space:normal;overflow-wrap:anywhere;width:max-content;translate:-50% -100%;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.o3-bubble span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;overflow:hidden}
.o3-zone{font:700 11px system-ui,sans-serif;color:#0b0d12;padding:1px 8px;border-radius:8px;translate:0 -100%;text-decoration:none}
.o3-zone.link{pointer-events:auto;cursor:pointer}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.room{flex-wrap:nowrap}.room .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.room input[type=number]{width:62px;padding:3px 5px;font-size:12px}.room select{font-size:12px;padding:3px 5px;max-width:170px}
.hint.ok{color:var(--ok)}
#msize input[type=number]{width:62px;padding:3px 5px;font-size:12px}
input[type=color]{width:34px;height:24px;padding:0 2px;vertical-align:middle}
input[type=file]{font-size:12px;max-width:100%}
body.editing #stage{outline:2px solid #ffd166;outline-offset:-2px}
body.editing #taskf{display:none}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,45%)}header{grid-template-columns:minmax(0,1fr) auto auto}}
</style>
</head>
<body class="nopanel">
<header>
  <div class="side"><span class="dot" id="dot"></span><h1 id="title">Office</h1><span id="status">loading…</span></div>
  <span class="mid"><span id="usage" title="Total tokens and estimated cost"></span><span id="ratelim"></span></span>
  <div class="side r">
  <span id="worlds"></span>
  <span id="editbtn"></span>
  <span id="views" title="3D: drag to rotate, wheel to zoom, right-drag to pan"></span>
  <select id="taskf" title="Show only the agents working on one task"><option value="">all agents</option></select>
  <select id="zoom" title="Zoom"><option value="fit">fit</option><option value="1">1×</option><option value="2">2×</option></select>
  <a class="ghost" id="dash" href="/" title="Back to the dashboard">⇦ dashboard</a>
  </div>
</header>
<main>
  <div id="stage"><div id="world"></div><div id="empty">Loading the office…</div></div>
  <aside id="panel"></aside>
</main>
<div id="rview"><div class="card"><div class="hd"><b id="rvtitle"></b><span class="sub" id="rvsub"></span><span class="spacer"></span>
  <button class="ghost" id="rvdl" title="Download the Markdown file">⬇</button><a class="ghost" id="rvdash" target="_blank" rel="noopener">open in dashboard ↗</a><button class="ghost" id="rvclose" title="Close">✕</button></div>
  <div class="bd"><div class="md" id="rvbody"></div></div></div></div>
<script type="importmap">{"imports": {"three": "/plugins/office/vendor/three/three.module.js"}}</script>
<script type="module" src="/plugins/office/office.js"></script>
</body>
</html>
