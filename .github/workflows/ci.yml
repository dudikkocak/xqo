name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install xqo
        run: |
          uv venv
          uv pip install -e "packages/xqo[dev]"
      - name: Tests
        run: uv run --no-project python -m pytest packages/xqo/tests -q --timeout 120

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and check its files
        run: uv run --no-project python tools/check_wheel.py packages/xqo
      - name: Install the wheel and import the public API
        run: |
          uv build --wheel --out-dir dist packages/xqo
          uv venv /tmp/w
          uv pip install --python /tmp/w/bin/python dist/xqo-*.whl
          /tmp/w/bin/python -c "import xqo.api as a; print(a.__version__, a.API_VERSION)"
          /tmp/w/bin/xqo --help > /dev/null
