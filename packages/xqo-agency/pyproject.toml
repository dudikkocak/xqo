[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xqo-agency"
version = "3.1.0"
description = "xqo agency: import agents from the agency-agents prompt library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "dudikkocak"}]
dependencies = [
  "xqo>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.urls]
Homepage = "https://github.com/dudikkocak/xqo"

[project.entry-points."xqo.plugins"]
agency = "xqo_agency:AgencyPlugin"

[tool.setuptools.packages.find]
where = ["src"]
